
name: Construir APK Lienzo

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Compilar Lienzo para Android
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3

      - name: Descomprimir proyecto Lienzo
        run: |
          unzip -o Lienzosubir.zip -d proyecto
          ROOT="proyecto"

          if [ ! -f "$ROOT/package.json" ]; then
            ROOT=$(dirname "$(find proyecto -name package.json -not -path '*/node_modules/*' | head -n 1)")
          fi

          if [ ! -f "$ROOT/package.json" ]; then
            echo "ERROR: No se encontró package.json"
            exit 1
          fi

          rsync -a \
            --exclude='.github/' \
            --exclude='keystore/' \
            "$ROOT/" ./

          test -f www/index.html

      - name: Instalar dependencias
        run: npm install

      - name: Crear proyecto Android
        run: npx cap add android

      - name: Aplicar mejoras de Lienzo
        run: |
          node scripts/pantalla-completa.js
          node scripts/icono.js

      - name: Sincronizar Capacitor
        run: npx cap sync android

      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Renombrar APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Lienzo.apk

      - name: Publicar APK descargable
        uses: actions/upload-artifact@v4
        with:
          name: Lienzo-APK
          path: Lienzo.apk
          retention-days: 30
